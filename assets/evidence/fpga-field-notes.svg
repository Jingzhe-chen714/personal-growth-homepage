<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">FPGA项目公开联调记录示意</title>
  <desc id="desc">原现象：显示器正常，电脑端严重卡顿，长时间工作后黑屏。处理：增加分配器和采集卡，补充硬件配置。结果：同步显示问题已解决，项目完成。此图不是实物接线图或运行截图。</desc>
  <rect width="1000" height="390" rx="12" fill="#eeece5"/>
  <g font-family="Microsoft YaHei,sans-serif" fill="#354039">
    <text x="32" y="44" font-size="23" font-weight="600">FPGA 串口界面联调记录</text>
    <text x="32" y="75" font-size="14" fill="#5f6b59">2026年9—10月 · 本人参与电脑端串口界面与联调 · 项目已完成</text>
    <g fill="#f7f5f0" stroke="#d4dace">
      <rect x="32" y="103" width="286" height="208" rx="8"/>
      <rect x="357" y="103" width="286" height="208" rx="8"/>
      <rect x="682" y="103" width="286" height="208" rx="8"/>
    </g>
    <g font-size="18" font-weight="600">
      <text x="52" y="140">观察到的问题</text>
      <text x="377" y="140">处理办法</text>
      <text x="702" y="140">结果与后续</text>
    </g>
    <g font-size="16">
      <text x="52" y="181">显示器：输出正常</text>
      <text x="52" y="216">电脑端：严重卡顿</text>
      <text x="52" y="251">运行时间较长后黑屏</text>
      <text x="377" y="181">购入并加入分配器</text>
      <text x="377" y="216">购入并加入采集卡</text>
      <text x="377" y="251">补充原有硬件配置</text>
      <text x="702" y="181" fill="#406551">同步显示问题已解决</text>
      <text x="702" y="216">后续补充设备型号</text>
      <text x="702" y="251">连接步骤与长期运行记录</text>
    </g>
    <g fill="#74866a"><path d="M328 198h17l-6-6m6 6-6 6" fill="none" stroke="#74866a" stroke-width="2"/><path d="M653 198h17l-6-6m6 6-6 6" fill="none" stroke="#74866a" stroke-width="2"/></g>
    <text x="32" y="353" font-size="13" fill="#5f6b59">这是根据项目复盘整理的现象与处理示意，不表示具体接口或接线顺序，也不是现场运行截图。</text>
  </g>
</svg>
