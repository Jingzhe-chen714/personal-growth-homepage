<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">字符串集合测试：输入、期望结果与实测结论</title>
  <desc id="desc">数组和链表两种实现均在2026年11月15日运行已有测试通过。输入集合A为apple、banana、cherry，B为banana、cherry、orange；交集为banana、cherry，差集A减B为apple。</desc>
  <rect width="980" height="420" rx="12" fill="#eeece5"/>
  <g font-family="Microsoft YaHei,sans-serif" fill="#354039">
    <text x="36" y="48" font-size="23" font-weight="600">字符串集合 · 两种实现的测试结果</text>
    <text x="36" y="79" font-size="14" fill="#5f6b59">实际运行日期：2026-11-15 · GCC 16.2.0 · C11 · 已有测试用例</text>
    <rect x="36" y="104" width="908" height="84" rx="7" fill="#f7f5f0" stroke="#dcded4"/>
    <g font-family="Consolas,monospace" font-size="19">
      <text x="56" y="138">A = {apple, banana, cherry}</text>
      <text x="56" y="168">B = {banana, cherry, orange}</text>
    </g>
    <g font-size="16">
      <text x="36" y="224">并集</text><text x="130" y="224">apple, banana, cherry, orange</text>
      <text x="36" y="258">交集</text><text x="130" y="258">banana, cherry</text>
      <text x="36" y="292">差集 A − B</text><text x="130" y="292">apple</text>
    </g>
    <rect x="36" y="315" width="438" height="48" rx="7" fill="#d9e3d7"/>
    <rect x="490" y="315" width="454" height="48" rx="7" fill="#d9e3d7"/>
    <text x="55" y="345" font-size="17" fill="#35523e">数组版：All tests passed.</text>
    <text x="509" y="345" font-size="17" fill="#35523e">链表版：All tests passed.</text>
    <text x="36" y="397" font-size="13" fill="#5f6b59">完整输出及源码提交号见配套测试记录；测试通过表示这些用例通过，不代表覆盖所有异常场景。</text>
  </g>
</svg>
